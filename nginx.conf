server {
    listen 80;
    client_max_body_size 0;
    location / {
        proxy_pass http://lxserver:9527/admin/;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://lxserver:9527/api/;
        proxy_set_header Host $http_host;
    }
    location ~ ^/(assets|js|css|img|fonts)/ {
        proxy_pass http://lxserver:9527$request_uri;
        proxy_set_header Host $http_host;
    }
    # 🚀 桥接接口（音源拉取、解压、上传等）
    location ~ ^/(search-sources|extract-zip|fetch-source|save-source|get-mirror|set-mirror|list-saved|peek-saved|export-source|delete-saved|download-saved|set-token|get-token|set_playmode|get_playmode) {
        proxy_pass http://bridge:8773;
        proxy_set_header Host $http_host;
    }
}