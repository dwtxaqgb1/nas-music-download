services:
  lxserver:
    image: xcq0607/lxserver:latest
    container_name: nas-music-download
    restart: unless-stopped
    expose:
      - "9527"
    environment:
      - NODE_ENV=production
      - FRONTEND_PASSWORD=123456
      - PORT=9527
      - BIND_IP=0.0.0.0
      - DATA_PATH=/server/data
      - LOG_PATH=/server/data/logs
    volumes:
      - ./data:/server/data
      - ./music:/server/music
      - ./cache:/server/cache
      - ./web:/server/public
    networks:
      - nas-music-net

  nginx:
    image: nginx:alpine
    container_name: nas-music-download-nginx
    restart: unless-stopped
    ports:
      - "5200:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lxserver
    networks:
      - nas-music-net

networks:
  nas-music-net:
