server {
    listen 80;
    server_name _;
    location = / {
        proxy_pass http://lxserver:9527/index.html;
    }
    location = /api/admin/password {
        proxy_pass http://sidecar:3001;
        proxy_set_header Content-Type application/json;
    }

    
    

    location /api/v1/ {
        proxy_pass http://host.docker.internal:8773/api/v1/;
        proxy_set_header Host $host;
    }
    location /stream/ {
        proxy_pass http://host.docker.internal:8773/stream/;
        proxy_buffering off;
    }
    location /cover/ {
        proxy_pass http://host.docker.internal:8773/cover/;
    }
    location ~ ^/(list-saved|list-saved-folders|list-saved-files|import-saved|delete-saved-folder|search-sources|fetch-source|save-source|delete-saved|export-source|download-saved|set-token|get-token|set_playmode|get_playmode|get-mirror|set-mirror|extract-zip) {
        proxy_pass http://host.docker.internal:8773;
    }
    location / {
        proxy_pass http://lxserver:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
