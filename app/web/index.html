<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS歌曲下载</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('nas_music_theme') || 'classic';
      document.documentElement.setAttribute('data-theme', t);

</div>

<div id="app" class="app hidden">

      <span class="app-logo">NAS MUSIC</span>

    <div class="topbar-right">

          <polyline points="7 10 12 15 17 10"></polyline>

        </svg>
      </button>
      <div class="theme-picker" id="themePicker">
        <button class="icon-btn theme-btn" id="themeBtn" title="切换主题" aria-label="切换主题" style="background:transparent; border:none; box-shadow:none; padding: 0 8px; width: auto; display: flex; align-items: center; justify-content: center;">
          <svg id="themeIcon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

          </button>
    </div>

  <nav class="tabbar">

  <main class="content">

    <section id="tab-rank" class="tab-panel">

          </div>

    </section>

    <section id="tab-playlist" class="tab-panel">

      <h3 style="margin:0;font-size:16px;color:var(--text);">我的歌单</h3>
    </div>
      <div id="playlistView">

      <div class="modal hidden" id="pastePlaylistModal">

            <h2>粘贴歌单</h2>

    <section id="tab-hot-playlist" class="tab-panel">
      <div style="padding:16px;">

<script>
// ===== 热门歌单 =====
var hotSrc = "kw";

window.switchHotSrc = function(src) {
  hotSrc = src;
  var btns = document.querySelectorAll("#tab-hot-playlist button");
  var btnNames = {'kw':'酷我','kg':'酷狗','mg':'咪咕','wy':'网易云','tx':'腾讯'};
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].textContent.trim() === btnNames[src]) {
      btns[i].style.background = "var(--blue)";
      btns[i].style.color = "white";
    } else {
      btns[i].style.background = "var(--bg3)";
      btns[i].style.color = "var(--text)";
    }
  }
  // 切换平台后自动弹出歌单弹窗
  openHotModal();
};

window.openHotModal = function() {
  document.getElementById("hotOverlay").style.display = "block";
  document.getElementById("hotModal").style.display = "flex";
  loadHotCats();
};

window.closeHotModal = function() {
  document.getElementById("hotOverlay").style.display = "none";
  document.getElementById("hotModal").style.display = "none";
};

function loadHotCats() {
  var catsDiv = document.getElementById("hotCats");
  catsDiv.innerHTML = '加载中...';
  
  fetch("/api/music/songList/list?source=" + hotSrc + "&page=1", {
    headers: {
      "x-user-name": typeof currentUser !== "undefined" ? currentUser : "",
      "x-frontend-auth": typeof authPassword !== "undefined" ? authPassword : ""
    }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var list = data.list || [];
    if (list.length === 0) {
      catsDiv.innerHTML = '暂无歌单';
      return;
    }
    
    var html = "";
    for (var i = 0; i < list.length; i++) {
      var pl = list[i];
      var id = (pl.id || "").replace(/'/g, "\'");
      var name = (pl.name || "").replace(/'/g, "\'");
      var img = pl.img || "";
      var author = pl.author || "";
      var total = pl.total || "";
      html += '<div onclick="selectHotPlaylist(\'' + id + '\',\'' + name + '\')" style="display:flex;align-items:center;gap:12px;padding:10px;margin:6px 0;background:var(--bg3);border-radius:8px;cursor:pointer;">'
        + '<img src="' + img + '" style="width:48px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg2);">'
        + '<div style="flex:1;min-width:0;">'
        + '<div style="color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (pl.name || "") + '</div>'
        + '<div style="color:var(--text2);font-size:12px;margin-top:4px;">' + author + ' · ' + total + '首</div>'
        + '</div>'
        + '</div>';
    }
    catsDiv.innerHTML = html;
  })
  .catch(function(e) {
    catsDiv.innerHTML = '加载失败: ' + e.message;
  });
}

window.selectHotPlaylist = function(id, name) {
  closeHotModal();
  document.getElementById("hotCurrentTitle").textContent = name;
  
  var listDiv = document.getElementById("hotList");
  listDiv.innerHTML = '加载中...';
  
  fetch("/api/music/songList/detail?source=" + hotSrc + "&id=" + encodeURIComponent(id), {
    headers: {
      "x-user-name": typeof currentUser !== "undefined" ? currentUser : "",
      "x-frontend-auth": typeof authPassword !== "undefined" ? authPassword : ""
    }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var songs = data.list || [];
    if (typeof renderSongList === "function") {
      renderSongList(listDiv, songs, "hot");
    } else {
      listDiv.innerHTML = '<div style="color:var(--text2);padding:20px;">渲染函数未加载</div>';
    }
  })
  .catch(function(e) {
    listDiv.innerHTML = '加载失败: ' + e.message;
  });
};

// 页面加载完成后，自动加载第一个歌单，不弹窗
window.addEventListener('load', function() {
  // 先获取歌单列表，然后自动选第一个
  fetch("/api/music/songList/list?source=kw&page=1", {
    headers: {
      "x-user-name": typeof currentUser !== "undefined" ? currentUser : "",
      "x-frontend-auth": typeof authPassword !== "undefined" ? authPassword : ""
    }
  })
  .then(r => r.json())
  .then(data => {
    var list = data.list || [];
    if (list.length > 0) {
      var first = list[0];
      // 直接调用 selectHotPlaylist，和用户点击一样
      selectHotPlaylist(first.id, first.name);
    }
  });
});
</script>
