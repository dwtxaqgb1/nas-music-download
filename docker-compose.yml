services:
  lxserver:
    build:
      context: .
      args:
        BASE_IMAGE: ${LXSERVER_IMAGE:-xcq0607/lxserver:v2.1.2}
    image: nas-music-lx:local
    restart: unless-stopped
    expose:
      - "9527"
    environment:
      - FRONTEND_PASSWORD=${FRONTEND_PASSWORD:-admin123}
      - PORT=9527
      - BIND_IP=0.0.0.0
    volumes:
      - ${MUSIC_DIR:-./music}:/server/music
      - ${MUSIC_DIR:-./music}:/server/cache/_open
      - ./data:/server/data
      - ./app/web/app.js:/server/public/app.js
      - ./app/web/index.html:/server/public/index.html
      - ./app/web/style.css:/server/public/style.css
      - ./app/web/server.js:/server/public/server.js
      - ./app/web/setup.js:/server/public/setup.js
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock

  bridge:
    image: python:3.11-alpine
    restart: unless-stopped
    expose:
      - "8773"
    command: python /app/lx_bridge.py
    environment:
      - SOURCE_DIR=/server/data/users/source/_open
    volumes:
      - ./app/lx_bridge.py:/app/lx_bridge.py
      - ./data:/server/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5200}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lxserver
